name: Build APK

# 推送到 main 分支或手动触发时打包
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer          # Kivy 官方打包镜像, 自带 buildozer + Android 工具链
    defaults:
      run:
        working-directory: kivy_android_demo   # 源码在子目录
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chinese font
        # 注意: kivy/buildozer 容器内没有 curl/wget, 用容器自带的 python3 下载
        run: |
          mkdir -p fonts
          python3 -c "
          import urllib.request, os
          url = 'https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf'
          urllib.request.urlretrieve(url, 'fonts/NotoSansSC-Regular.otf')
          size = os.path.getsize('fonts/NotoSansSC-Regular.otf')
          print('字体下载完成: %d bytes' % size)
          assert size > 1000000, '字体下载异常, 文件过小'
          "
          ls -la fonts/

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zggg-demo-apk
          path: kivy_android_demo/bin/*.apk
          if-no-files-found: error
